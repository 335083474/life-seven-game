<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#152722">
<title>逆转人生 · 命运档案馆｜视觉交互原型</title>
<style>
:root{
 --night:#111e1a;--pine:#182d26;--pine2:#233a30;--pine3:#30483b;--paper:#f1e9d9;--paper-warm:#e9dfcd;--light:#f9f2e5;--ochre:#bc9d66;--brass:#d1b88a;--hair:rgba(182,155,108,.33);--char:#2a332c;--type:#382f26;--muted:#8a806f;--red:#a15d53;--red-deep:#71413d;--jade:#779484;--serif:"Noto Serif CJK SC","Songti SC","SimSun",Georgia,serif;--sans:"Noto Sans CJK SC","Microsoft Yahei",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--night);scroll-behavior:smooth}
body{margin:0;color:var(--paper);font-family:var(--sans);line-height:1.65;background:var(--night);min-width:320px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.055;z-index:70;background-image:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(223,205,155,.12) 4px),repeating-linear-gradient(90deg,transparent 0,transparent 5px,rgba(13,27,19,.13) 6px)}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.38}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ochre);outline-offset:4px}
button:active{transform:translateY(1px)}
::selection{background:var(--ochre);color:var(--night)}
.serif{font-family:var(--serif)}.caps{font-family:Georgia,serif;font-size:10px;letter-spacing:.25em;text-transform:uppercase}.thin{font-weight:300}.hidden{display:none!important}
#app{min-height:100vh;overflow-x:hidden}
.signet{width:24px;height:24px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.topbar{height:83px;border-bottom:1px solid rgba(203,174,124,.22);display:flex;align-items:center;justify-content:space-between;gap:25px;padding:0 clamp(24px,5.3vw,100px);position:relative;z-index:8;background:rgba(13,27,22,.55)}
.brand{display:flex;align-items:center;gap:12px;border:0;color:#e3d4b8;background:transparent;padding:0;text-align:left}
.brand__mark{width:35px;height:35px;color:#c3a476;border:1px solid #8d7653;display:flex;align-items:center;justify-content:center;transform:rotate(45deg)}
.brand__mark .signet{transform:rotate(-45deg);width:18px;height:18px}
.brand__cn{font-family:var(--serif);font-size:21px;letter-spacing:.18em;font-weight:650}.brand__en{font-family:Georgia,serif;font-size:8px;letter-spacing:.32em;text-transform:uppercase;color:#b6a78c;margin-top:-1px}
.topnav{display:flex;align-items:center;gap:38px}
.topnav button{background:transparent;border:none;color:#b9b5a7;font-size:12px;letter-spacing:.12em;padding:28px 0;position:relative}
.topnav button.active,.topnav button:hover{color:#f4e6c9}.topnav button.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--ochre)}
.topmeta{font-size:10px;letter-spacing:.15em;color:#bea984;display:flex;align-items:center;gap:14px}.topmeta span{border:1px solid rgba(188,157,102,.4);padding:5px 10px}
.nav-mobile{display:none}
.btn{border:1px solid transparent;padding:14px 24px;display:inline-flex;gap:14px;align-items:center;justify-content:center;min-height:48px;letter-spacing:.08em;font-size:12px;font-weight:500;background:transparent;color:inherit;transition:background .2s,border-color .2s,color .2s;white-space:nowrap}
.btn .signet{width:17px;height:17px}.btn--gold{background:#c4a474;color:#172820;border-color:#d4b987}.btn--gold:hover:not(:disabled){background:#efd09c}
.btn--line{border-color:rgba(205,181,135,.56);color:#e9dcc4}.btn--line:hover{background:rgba(232,216,177,.1)}
.btn--paper{background:var(--pine);border-color:#20372e;color:#f6e8cf}.btn--paper:hover{background:#345047}
.btn--text{border:0;color:#ba9e73;padding:12px 8px}
.btn--danger{border-color:#ab796b;color:#884f46;background:#f0dfd4}
.btn--small{min-height:35px;padding:8px 12px;font-size:11px}
.num{font-family:Georgia,serif;font-variant-numeric:tabular-nums}
/* HOME */
.home{min-height:100vh;position:relative;background:radial-gradient(ellipse at 68% 30%,#304739 0%,transparent 43%),radial-gradient(ellipse at 3% 90%,#233c31 0%,transparent 36%),#152720}
.home::after{content:"";position:absolute;inset:83px 0 0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent 139px,rgba(188,157,102,.03) 140px,transparent 141px)}
.hero{max-width:1550px;margin:0 auto;min-height:730px;display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,.92fr);gap:4vw;padding:62px clamp(32px,7vw,115px) 70px;align-items:center;position:relative;z-index:2}
.hero__copy{align-self:center;padding-bottom:10px}
.eyebrow{display:flex;align-items:center;gap:15px;color:#c7a974;font:11px Georgia,serif;letter-spacing:.28em;text-transform:uppercase}
.eyebrow:before{content:"";height:1px;background:#be9f70;width:44px}
.hero__title{font-family:var(--serif);font-weight:550;letter-spacing:.05em;font-size:clamp(54px,5.4vw,92px);line-height:1.32;margin:30px 0 17px;text-shadow:0 2px 30px rgba(0,0,0,.1)}
.hero__title em{font-style:normal;color:#d0b27d}
.hero__engraving{font-family:Georgia,serif;font-size:12px;letter-spacing:.36em;color:#ac9872;margin:8px 0 20px}
.hero__desc{max-width:495px;font-size:15px;color:#c6c7b5;line-height:2.2;letter-spacing:.035em}
.hero__actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:37px}
.hero__side-note{display:flex;align-items:center;gap:12px;color:#a8a893;font-size:11px;letter-spacing:.06em;margin-top:31px}.hero__side-note span{display:block;width:33px;height:1px;background:#a68e63}
.hero__frame{position:relative;min-width:0;max-width:585px;width:100%;justify-self:end}
.hero__frame:before,.hero__frame:after{content:"";position:absolute;width:28px;height:28px;border-color:#bb9b69;border-style:solid;opacity:.8;pointer-events:none;z-index:2}
.hero__frame:before{top:-12px;left:-12px;border-width:1px 0 0 1px}.hero__frame:after{bottom:-12px;right:-12px;border-width:0 1px 1px 0}
.hero__plate{border:1px solid rgba(193,159,108,.68);background:var(--paper-warm);box-shadow:26px 32px 40px rgba(0,0,0,.23);position:relative;overflow:hidden}
.hero__plate>svg{display:block;width:100%;height:auto;aspect-ratio:570/590}
.plate-caption{background:#21382f;color:#e8d8bd;display:flex;justify-content:space-between;align-items:center;padding:15px 22px;border-top:1px solid #c0a16c;font-size:10px;letter-spacing:.18em}
.plate-caption span:last-child{font-family:Georgia,serif;color:#bca779;font-size:11px}
.home__bottom{position:relative;z-index:2;max-width:1530px;margin:0 auto;border-top:1px solid rgba(192,159,103,.24);padding:25px clamp(32px,7vw,115px) 29px;display:grid;grid-template-columns:1.1fr 1fr;gap:25px;color:#aea890}
.home__stats{display:flex;gap:36px;align-items:center}.home__stat{display:flex;align-items:center;gap:10px}.home__stat strong{font-family:Georgia,serif;font-size:30px;color:#d5bc8e;font-weight:400}.home__stat small{font-size:10px;letter-spacing:.14em}
.home__poem{text-align:right;align-self:center;font-family:var(--serif);font-size:12px;letter-spacing:.16em;color:#b9ae91}
/* shared shell */
.view{min-height:100vh;background:radial-gradient(circle at 10% 40%,rgba(69,93,72,.28),transparent 35%),#172a23}
.subbar{height:73px;background:#15241e;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,3.5vw,68px);gap:20px;border-bottom:1px solid rgba(189,156,103,.28)}
.subbar .brand__cn{font-size:17px}.subbar__right{display:flex;align-items:center;gap:20px}.subbar__right .caps{color:#c3a36d}
.backlink{color:#c0aa80;border:0;background:none;font-size:12px;display:flex;align-items:center;gap:6px;padding:8px}.backlink:hover{color:white}
/* DRAW */
.draw{max-width:1200px;margin:0 auto;padding:49px 30px 80px}
.chapter-mark{font-family:Georgia,serif;color:#cbb180;letter-spacing:.2em;font-size:12px;text-align:center}
.section-title{font-family:var(--serif);font-weight:600;font-size:clamp(33px,3.6vw,53px);letter-spacing:.17em;text-align:center;margin:13px 0 7px;color:#f0e3cf}
.subtitle{text-align:center;color:#b7ad9b;font-family:var(--serif);font-size:13px;letter-spacing:.1em}
.draw__intro{max-width:630px;text-align:center;margin:20px auto 29px;color:#b8beae;line-height:2.1;font-size:13px}
.draw__name{display:flex;align-items:center;justify-content:center;gap:13px;margin-bottom:28px;font-size:12px;color:#c5b398}
.draw__name input{border:0;border-bottom:1px solid #8b7a5b;color:#eee3d0;background:transparent;padding:9px 12px;width:172px;text-align:center;border-radius:0}
.draw__name input::placeholder{color:#7c867b}
.draw__cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:820px;margin:25px auto 33px}
.draw__actions{display:flex;justify-content:center;gap:15px}
.draw__footnote{text-align:center;color:#9f9e8e;font-size:11px;margin-top:24px;letter-spacing:.04em}
/* Cards */
.element-card{--c:var(--ochre);position:relative;aspect-ratio:0.7;min-height:130px;border:1px solid #c5b596;background:#eee5d3;color:#27352c;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 9px 11px;isolation:isolate;box-shadow:0 7px 15px rgba(0,0,0,.16);overflow:hidden;transition:transform .23s ease,border-color .23s,box-shadow .23s}
.element-card:before{content:"";position:absolute;inset:5px;border:1px solid rgba(76,67,43,.34);pointer-events:none}.element-card:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0,transparent 16px,rgba(82,69,42,.027) 17px);z-index:-1}
.element-card:hover{transform:translateY(-3px);box-shadow:0 12px 22px rgba(0,0,0,.2)}
.element-card__top{display:flex;align-items:center;justify-content:space-between;width:100%;font:9px Georgia,serif;color:#8c785b;letter-spacing:.12em;line-height:1}
.element-card__sigil{height:43%;width:82%;display:flex;align-items:center;justify-content:center;position:relative;color:#6c735d}
.element-card__sigil:before{content:"";width:min(60%,70px);aspect-ratio:1;position:absolute;border:1px solid rgba(97,110,81,.37);border-radius:50%;box-shadow:0 0 0 4px rgba(97,110,81,.04),0 0 0 9px rgba(97,110,81,.035)}
.element-card__sigil .signet{width:56%;height:65%;stroke-width:1.15}
.element-card__name{font-family:var(--serif);font-size:clamp(14px,1.4vw,20px);font-weight:650;letter-spacing:.1em;white-space:nowrap}
.element-card__tag{font:9px Georgia,serif;letter-spacing:.14em;color:#8b7d66;text-transform:uppercase}
.element-card__bottom{width:100%;display:flex;align-items:center;justify-content:space-between;font-family:Georgia,serif;font-size:11px;color:#7d6d50}
.element-card--ii{background:#e6e0c9;border:1px solid #aaa67f}.element-card--ii .element-card__sigil{color:#4b6c5a}.element-card--ii:before{border:2px double rgba(58,97,75,.56)}
.element-card--iii{background:#243b31;color:#f2e7c8;border:1px solid #d2b779;box-shadow:0 8px 26px rgba(0,0,0,.35)}.element-card--iii:before{border:1px double #b89d67;inset:5px}.element-card--iii:after{background:repeating-linear-gradient(35deg,transparent 0,transparent 15px,rgba(214,176,99,.04) 16px)}
.element-card--iii .element-card__top,.element-card--iii .element-card__tag,.element-card--iii .element-card__bottom{color:#d6bc88}.element-card--iii .element-card__sigil{color:#e3c78d}.element-card--iii .element-card__sigil:before{border-color:#ad9161;box-shadow:0 0 0 5px rgba(194,160,93,.07),0 0 0 12px rgba(194,160,93,.06)}
.element-card--back{background:#273b30;border-color:#ab9067;color:#ddc797;justify-content:center;gap:13px}.element-card--back:before{inset:7px;border:1px solid #b19c77}.element-card--back .backseal{border:1px solid #a89776;padding:24px;display:grid;place-items:center;transform:rotate(45deg)}.element-card--back .backseal .signet{transform:rotate(-45deg);width:37px;height:37px}
.element-card--back .backlabel{font:10px Georgia,serif;letter-spacing:.28em;color:#c3ac81}
.element-card--compact{min-height:0;padding:10px 5px 9px;width:100%;aspect-ratio:.74;box-shadow:none}
.element-card--compact:before{inset:4px}.element-card--compact .element-card__top{font-size:7px}.element-card--compact .element-card__tag{font-size:7px}.element-card--compact .element-card__name{font-size:clamp(11px,1vw,14px)}.element-card--compact .element-card__bottom{font-size:9px}
.card-select{border:0;padding:0;background:none;width:100%;color:inherit;min-width:0;text-align:initial}
.card-select.selected .element-card{border:2px solid #d2b16d;transform:translateY(-5px);box-shadow:0 12px 0 -7px #c39c62,0 10px 22px rgba(0,0,0,.3)}
.card-select:disabled{opacity:.36}
/* GAME */
.play{display:grid;grid-template-columns:160px minmax(0,1fr) 328px;max-width:1690px;margin:0 auto;min-height:calc(100vh - 73px);border-left:1px solid rgba(192,156,109,.16);border-right:1px solid rgba(192,156,109,.16)}
.chapter-rail{border-right:1px solid rgba(197,163,107,.28);background:#172b24;padding:30px 18px 32px;display:flex;flex-direction:column;gap:6px}
.rail-head{font:10px Georgia,serif;letter-spacing:.17em;color:#bf9e69;padding-bottom:20px;border-bottom:1px solid rgba(186,155,105,.18);margin-bottom:14px}
.rail-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#8c9a89;padding:13px 5px;text-align:left;position:relative;font-size:11px;transition:color .2s}
.rail-item:before{content:"";position:absolute;left:13px;top:39px;height:29px;width:1px;background:rgba(188,167,119,.23)}.rail-item:last-child:before{display:none}
.rail-item .roman{font-family:Georgia,serif;display:grid;place-items:center;width:28px;height:28px;border:1px solid #536754;border-radius:50%;flex-shrink:0;font-size:11px}
.rail-item.current,.rail-item:hover{color:#efe0be}.rail-item.current .roman{color:#1a2a23;background:#d3b680;border-color:#d3b680}
.rail-item small{display:block;color:#718373;font-size:9px;letter-spacing:.04em;margin-top:3px}
.rail-bottom{margin-top:auto;font-family:var(--serif);font-size:11px;color:#809283;line-height:2.2;padding:40px 7px 12px}.rail-bottom:before{content:"❧";display:block;color:#b9a070;font-size:25px}
.play-center{background:var(--paper);color:var(--type);min-width:0;position:relative;padding:36px clamp(30px,4vw,70px) 65px;box-shadow:inset 0 0 95px rgba(113,82,35,.12)}
.play-center:before{content:"";position:absolute;inset:13px;pointer-events:none;border:1px solid rgba(110,92,59,.18)}
.play-center>*{position:relative}
.play__stage-head{display:flex;justify-content:space-between;align-items:start;gap:20px;padding-bottom:23px;border-bottom:1px solid rgba(123,102,67,.25)}
.stage-small{font:10px Georgia,serif;letter-spacing:.2em;color:#8d7958}.stage-name{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.13em;margin:8px 0 0}.stage-age{font-size:11px;color:#82775e;letter-spacing:.12em;text-align:right;padding-top:14px}
.phase-progress{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:23px 0 31px;border:1px solid rgba(106,91,67,.25)}
.phase-progress span{padding:10px 6px;font-size:11px;letter-spacing:.1em;text-align:center;border-right:1px solid rgba(106,91,67,.18);color:#a19b86}
.phase-progress span:last-child{border:0}.phase-progress span.current{color:#ebdfc9;background:#2a4036}.phase-progress span.done{color:#446150;background:rgba(82,116,91,.11)}
.event-kicker{display:flex;align-items:center;gap:10px;color:#8b7757;font:11px Georgia,serif;letter-spacing:.18em;text-transform:uppercase}
.event-kicker:after{content:"";display:block;height:1px;background:rgba(119,97,58,.22);flex:1}
.event-title{font-family:var(--serif);font-size:clamp(27px,2.4vw,38px);letter-spacing:.08em;font-weight:600;margin:12px 0 7px}
.event-desc{font-family:var(--serif);font-size:13px;line-height:2;color:#746b5c;max-width:650px;margin:0 0 16px}
.etching-strip{height:180px;border:1px solid #c2b49b;margin:15px 0 26px;overflow:hidden;background:#e4dbc6;position:relative}
.etching-strip svg{width:100%;height:100%;display:block}
.paper-rule{display:flex;align-items:center;gap:15px;font:10px Georgia,serif;letter-spacing:.16em;color:#927e5b;margin:24px 0 14px}.paper-rule:after{content:"";display:block;height:1px;background:#cbbda4;flex:1}
.fixed-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.option{min-height:81px;text-align:left;border:1px solid #c6b8a0;background:rgba(255,251,240,.44);display:flex;justify-content:space-between;align-items:center;gap:13px;padding:16px 16px;transition:border-color .2s,background .2s}
.option:hover{background:#f9f2e4;border-color:#aa8853}.option.selected{border-color:#39594a;background:#e1e6d8;box-shadow:inset 0 0 0 1px #39594a}
.option__main strong{font-family:var(--serif);font-size:15px;display:block;letter-spacing:.05em;font-weight:600}.option__main small{font-size:10px;color:#958b76;display:block;margin-top:4px}
.option__reward{font-size:11px;color:#526e5a;white-space:nowrap;border-left:1px solid #d4c5a9;padding-left:13px}
.event-bottom{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:28px;border-top:1px solid rgba(127,108,71,.23);padding-top:24px}.event-bottom .quiet{color:#9c907e;font-size:11px;max-width:265px}
.play-aside{background:#20372e;color:#ebddc7;padding:30px 24px 35px;display:flex;flex-direction:column;gap:25px;min-width:0;border-left:1px solid rgba(203,170,111,.23)}
.aside-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#e4d2ad;font-family:var(--serif);font-size:16px;letter-spacing:.12em}.aside-heading small{font:10px Georgia,serif;color:#ae9873;letter-spacing:.1em}
.aside-player{display:flex;align-items:center;gap:10px;padding:3px 0 14px;border-bottom:1px solid rgba(190,164,121,.22)}
.aside-avatar{height:34px;width:34px;border:1px solid #b49c74;border-radius:50%;display:grid;place-items:center;color:#dbc390;font-family:var(--serif)}
.aside-player strong{font-size:12px;font-weight:500;display:block}.aside-player small{font-size:10px;color:#9aab98}
.aside-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:15px}
.aside-cards .element-card{aspect-ratio:.7;min-height:0;padding:6px 3px 7px}
.aside-cards .element-card:before{inset:3px}.aside-cards .element-card__top{font-size:6px}.aside-cards .element-card__sigil:before{width:55%}.aside-cards .element-card__sigil .signet{width:58%;height:55%}.aside-cards .element-card__name{font-size:10px}.aside-cards .element-card__tag{font-size:6px;letter-spacing:0}.aside-cards .element-card__bottom{font-size:7px}
.empty-card{border:1px dashed rgba(207,187,146,.42);aspect-ratio:.7;background:rgba(4,19,10,.12);display:grid;place-items:center;color:#7d967f;font-family:Georgia,serif}
.aside-hint{color:#a6af9a;font-size:10px;line-height:1.8;margin-top:9px}.aside-hint strong{color:#d6c69d;font-weight:500}
.aside-extra{border-top:1px solid rgba(190,164,121,.2);padding-top:23px}.person-pill{display:flex;align-items:center;gap:9px;color:#c8c3a9;font-size:11px;margin-top:12px}.person-pill:before{content:"";width:6px;height:6px;border:1px solid #bca77d;transform:rotate(45deg)}
.journal-peek{font-family:var(--serif);color:#c3bca8;font-size:11px;line-height:2;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-top:14px}
.aside-footer{margin-top:auto}.aside-footer button{width:100%;justify-content:space-between}
/* FREE */
.free-input{width:100%;min-height:104px;background:#f8f1e4;color:var(--type);border:1px solid #c0b295;padding:13px 16px;line-height:1.9;font-family:var(--serif);font-size:13px;resize:vertical}
.free-presets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 17px}.free-presets button{border:1px solid #c8baa1;background:transparent;padding:5px 11px;font-size:10px;color:#695f4c}.free-presets button:hover{background:#e2dccb}
.free-teammates{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}.checkline{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:11px;color:#5b6657}.checkline input{accent-color:#315344;width:16px;height:16px}
.free-cards{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin:12px 0}
.free-card-note{color:#8b7b5e;font-size:11px;margin-bottom:10px}
.roll-panel{background:#e7dfcd;border:1px solid #c0ae8a;padding:17px 20px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;margin-top:18px}
.roll-panel h4{font-size:11px;font-weight:500;color:#84775c;margin:0 0 8px}.roll-panel p{font-size:10px;color:#938872;margin:4px 0}.roll-panel .rate{font:39px Georgia,serif;color:#2a493a;line-height:1}.risk{font-size:11px;color:#965e52;letter-spacing:.07em}

small{font-size:9px}.option__reward{font-size:10px;padding-left:6px}.event-bottom{margin-top:20px;padding-top:16px;gap:5px}.event-bottom .quiet{font-size:9px}.play-aside{display:block;padding:24px 19px}.aside-group{margin-bottom:25px}.aside-cards{grid-template-columns:repeat(7,minmax(0,1fr))}.aside-cards .element-card{padding:4px 2px 5px}.aside-cards .element-card__name{font-size:8px}.aside-cards .element-card__top,.aside-cards .element-card__bottom{font-size:5px}.aside-cards .element-card__tag{display:none}.aside-cards .element-card__sigil:before{width:60%}.aside-extra{margin:20px 0}.free-cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.free-cards .element-card--compact{max-width:117px}.roll-panel{padding:12px}.roll-panel .rate{font-size:31px}.swan-art{height:210px}.ending-wrap{padding:26px 14px}.ending-header h1{font-size:30px}.book-spread{grid-template-columns:1fr}.book-cover{min-height:430px;padding:33px 35px}.book-cover__art{height:210px}.book-page{padding:32px 25px}.book-page__text{font-size:12px}.dialog{padding:30px 21px}.dialog__cards{grid-template-columns:repeat(4,1fr);gap:5px}.dialog__choice{padding:10px 5px;font-size:10px}}

<script>
(()=>{
'use strict';
const app=document.getElementById('app');
const phases=['固定事件','自由事件','黑天鹅'];
const stages=[
 {name:'命运初启',age:'7岁',sub:'这一生，从四张卡开始',title:'天赋初醒',intro:'世界尚未向你提出问题，命运已经悄悄写下开头。',opts:[]},
 {name:'少年抉择',age:'14—18岁',sub:'远行之前',title:'下一站，去往哪里？',intro:'高中时代将要结束。熟悉的街道仍在身后，而世界正向你打开四扇不同的门。',opts:[['国内院校','求知问学','知识'],['艺术院校','让想象有一个归处','梦想'],['国外院校','走向陌生的远方','阅历'],['辍学','先一步进入真实世界','自由']]},
 {name:'青春远行',age:'19—24岁',sub:'青年之书',title:'在青春里留下什么？',intro:'年轻时的选择往往轻得像纸，却会成为多年以后人生的一页。',opts:[['活动社团','参与舞台与创作','才艺'],['外交社团','学习勇敢地与世界交谈','勇气'],['学习社团','沉入知识的深处','知识'],['不参加社团','把时间还给自己','自由']]},
 {name:'立业之初',age:'25—32岁',sub:'生活渐渐有了重量',title:'第一次独自面对世界',intro:'离开校园后，你需要选择如何立足。稳定、冒险和自由，每条路都需要代价。',opts:[['自主创业','由自己掌握方向','勇气'],['发展中公司','在变化中积累经验','技能'],['稳定单位','用耐心建立生活秩序','沉稳'],['自由职业','选择另一种工作方式','自由']]},
 {name:'人生交汇',age:'33—42岁',sub:'相遇、牵绊与选择',title:'什么值得与你共度时光？',intro:'事业渐渐成形，你也遇见越来越多需要珍惜、需要告别的人。',opts:[['拥抱爱情','向一段亲密关系靠近','爱情'],['经营家庭','为日常生活留下位置','家庭'],['珍视朋友','与重要的人保持联系','朋友'],['独自生长','保有独立与空间','自由']]},
 {name:'盛衰离别',age:'43—55岁',sub:'曾经坚信的事开始改变',title:'当生活出现裂痕',intro:'人生已不再只是得到。你开始理解坚持、转身与失去的不同重量。',opts:[['继续坚持','承担决定带来的代价','毅力'],['重新开始','为新的道路鼓起勇气','勇气'],['放慢脚步','重新学习与自己相处','修养'],['陪伴家人','把时间留给值得的人','快乐']]},
 {name:'余生',age:'60岁以后',sub:'此后余生',title:'此后的时间，留给什么？',intro:'你已经走过了大半生。曾经追逐的，有些得到，有些远去。命运还有最后一页留给你。',opts:[['安享晚年','在平静中修养身心','修养'],['陪伴亲友','把日子留给重要的人','快乐'],['退而不休','继续留下经验与价值','尊重'],['再追旧梦','拾起多年未竟的心愿','梦想'],['回馈社会','把曾接受的善意传下去','善良']]}
];
const cardIcons={'父母':'parents','家庭':'family','孩子':'child','爱情':'heart','快乐':'sun','朋友':'handshake','知识':'book','技能':'tree','智慧':'eye','才艺':'flower','勇气':'compass','沉稳':'hourglass','毅力':'tree','幽默':'sun','善良':'heart','修养':'leaf','财富':'coin','地位':'crown','权力':'scales','尊重':'crown','名气':'star','人脉':'handshake','健康':'health','梦想':'star','自由':'feather','阅历':'compass','信仰':'star','颜值':'flower'};
const cardDescriptions={'父母':'人生最初的庇护','家庭':'由相守写成的章节','孩子':'生命延续的另一种方式','快乐':'温柔而短暂的光','健康':'使你继续前行的力量','梦想':'心里始终亮着的灯','知识':'通向世界深处的门','勇气':'明知未知，仍愿出发','财富':'你拥有，也可能失去','善良':'将光留给另一个人','修养':'岁月沉淀后的从容','自由':'永远有另一条路','朋友':'陪你走过一段路的人'};
const roman=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ'];
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const signet=(name,cls='')=>`<svg class="signet ${cls}" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const state={screen:'home',mode:'solo',name:'',cards:[],revealed:false,stage:1,phase:0,selectedChoice:null,selectedCards:[],freeText:'',team:false,actionResult:null,swanResult:null,journal:[],pendingAward:null,pendingNext:null,lastRoll:null,room:false};
function cardSvgData(name){return cardIcons[name]||'star'}
function cardHtml(card,{compact=false,back=false}={}){
 if(back)return `<div class="element-card element-card--back"><div class="backseal">${signet('hourglass')}</div><div class="backlabel">UNWRITTEN</div></div>`;
 const tier=card.level||1;
 return `<div class="element-card ${tier===2?'element-card--ii':tier===3?'element-card--iii':''} ${compact?'element-card--compact':''}"><div class="element-card__top"><span>VII·LIFE</span><span>${roman[tier-1]}</span></div><div class="element-card__sigil">${signet(cardSvgData(card.name))}</div><div class="element-card__name">${esc(card.name)}</div><div class="element-card__tag">${tier===3?'LIFE ACHIEVEMENT':tier===2?'AWAKENED':'LIFE ELEMENT'}</div><div class="element-card__bottom"><span>✦</span><span>${tier===3?'典藏':tier===2?'精进':'初识'}</span><span>✦</span></div></div>`;
}
function header(kind='home'){
 const home=kind==='home';

function getFreeCategory(t){if(/研究|科研|科技|发明|技术|芯片|AI|人工智能|实验/.test(t))return 'science';if(/创业|公司|生意|投资|商业|开店|书店|餐馆/.test(t))return 'business';if(/旅行|远方|环球|探险|登山|海/.test(t))return 'travel';if(/公益|慈善|帮助|学校|支教|教育/.test(t))return 'kind';if(/朋友|结婚|爱情|家庭|陪伴|求婚/.test(t))return 'relation';return 'life'}
function calcProbability(){const category=getFreeCategory(state.freeText);const match={science:{strong:['知识','技能','智慧','毅力'],medium:['财富','人脉','勇气','沉稳']},business:{strong:['财富','技能','人脉','勇气'],medium:['知识','沉稳','尊重','智慧']},travel:{strong:['阅历','自由','健康','勇气'],medium:['财富','朋友','梦想','技能']},kind:{strong:['善良','人脉','勇气','尊重'],medium:['财富','快乐','智慧','朋友']},relation:{strong:['爱情','家庭','朋友','快乐'],medium:['善良','幽默','尊重','沉稳']},life:{strong:['梦想','勇气','自由','毅力'],medium:['修养','智慧','快乐','健康']}}[category];
 // Demonstration-only difficulty heuristic. Base tiers and multipliers reflect the current discussion, not an AI decision.
 let difficulty='普通';let base=45;let factor=1;
 if(/世界第一|联合国|世界首富|改变全世界/.test(state.freeText)){difficulty='传奇';base=5;factor=.25}
 else if(/全球|国家|突破性|登顶|征服|革命/.test(state.freeText)){difficulty='极难';base=10;factor=.5}
 else if(/研发|创业|创办|成立|开发|移民|登山/.test(state.freeText)){difficulty='困难';base=25;factor=.8}
 else if(/散步|整理|阅读|做饭/.test(state.freeText)){difficulty='简单';base=65;factor=1}
 const parts=state.selectedCards.map(idx=>{const c=state.cards[idx];const lvl=Math.min(c.level,2);const kind=match.strong.includes(c.name)?'高度匹配':match.medium.includes(c.name)?'一般匹配':'暂不匹配';const value=(kind==='高度匹配'?8:kind==='一般匹配'?4:0)*lvl;return {name:c.name,level:c.level,kind,value}});
 const group={};for(const p of parts){(group[p.name]||(group[p.name]=[])).push(p)};let raw=0;

function downloadStory(){const sample=state.journal.length===0;const text=`逆转人生 · 人生传记视觉样稿\n${sample?'【虚构示例，非真实游戏存档】':'【本地故事演示，非AI完整传记】'}\n\n${sample?document.querySelector('.book-page__text')?.innerText:endingStory().join('\n\n')}\n\n—— 命运档案馆 ——`;const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='逆转人生_人生传记_演示.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
document.addEventListener('click',e=>{let button=e.target.closest('[data-action]');if(!button)return;const act=button.dataset.action,idx=+button.dataset.index;switch(act){case'home':state.screen='home';render();scrollTo(0,0);break;case'start':start();break;case'multi':startMulti();toast('联机仅为界面演示，未创建真实房间');break;case'demo-game':if(state.cards.length<3)startMulti();else{state.screen='game';render()}break;case'ending':state.screen='ending';render();scrollTo(0,0);break;case'reveal':reveal();break;case'begin-play':state.stage=1;state.screen='game';render();break;case'select-fixed':state.selectedChoice=idx;render();break;case'fixed-commit':fixedCommit();break;case'preset':state.freeText=button.dataset.value;render();break;case'select-card':if(state.selectedCards.includes(idx))state.selectedCards=state.selectedCards.filter(x=>x!==idx);else if(state.selectedCards.length<2)state.selectedCards.push(idx);else toast('每人最多选择两张关键元素');render();break;case'roll-free':handleFreeRoll();break;case'free-result-next':closeModal();state.phase=2;render();break;case'roll-swan':handleSwan();break;case'next-chapter':nextChapter();break;case'preview-stage':if(idx===0){state.screen='draw';state.revealed=state.cards.length>=4;render()}else{state.screen='game';state.stage=idx;state.phase=0;state.selectedChoice=null;render();toast(`已切换到「${stages[idx].name}」演示`)}break;case'card-detail':showCard(idx);break;case'journal':showJournal();break;case'close':closeModal();break;case'replace':{const old=state.cards[idx];if(!old)return;const name=state.pendingAward;state.cards.splice(idx,1,{name,level:1});entry(state.stage,'人生取舍',`为留下新的「${name}」，你决定告别「${old.name}」。`);state.pendingAward=null;const next=state.pendingNext;state.pendingNext=null;closeModal();if(next==='next-chapter')nextChapter();else render();toast(`放下「${old.name}」，留下「${name}」`);break}case'reject-award':entry(state.stage,'人生取舍',`虽然获得「${state.pendingAward}」的机会，你还是决定守住原有的七种元素。`);state.pendingAward=null;const skipNext=state.pendingNext;state.pendingNext=null;closeModal();if(skipNext==='next-chapter')nextChapter();else render();break;case'invite':openModal(`<div class="caps">CO-OPERATION PREVIEW</div><h2>命运从此交汇</h2><p>正式联机时，你可以在自由事件中邀请最多两位玩家；他们各自选择最多两张卡，所有正式参与者确认后，由服务器统一掷骰结算。</p><div class="notice">当前仅为静态流程预览。没有房间服务，不会发送真正的邀请。</div><div class="dialog__buttons"><button class="btn btn--paper" data-action="close">知道了</button></div>`);break;case'copy-story':copyStory();break;case'download-story':downloadStory();break;}});
app.addEventListener('input',e=>{if(e.target.id==='freeText'){state.freeText=e.target.value;const p=calcProbability();const panel=app.querySelector('.roll-panel');if(panel){panel.innerHTML=`<div><h4>DIFFICULTY · ${p.difficulty} / 基础 ${p.base}%</h4><p>合作加成 +${p.teamwork}% · 元素有效加成 +${p.bonus}%</p><p class="risk">黑天鹅之外 · 本次大失败 ${p.fumble}%</p></div><div style="text-align:right"><div class="rate">${p.probability}<small style="font-size:16px">%</small></div><div style="font-size:9px;color:#89795e;letter-spacing:.05em">本地演示成功率</div></div>`}}});
app.addEventListener('change',e=>{if(e.target.id==='team'){state.team=e.target.checked;const v=document.getElementById('freeText')?.value;state.freeText=v??state.freeText;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
})();
</script>
</body></html>
